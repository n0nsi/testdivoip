name: shell checks

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iputils-ping mtr-tiny traceroute whois bc shellcheck

      - name: Run repository checks
        run: bash verify.sh

      - name: Run ShellCheck
        run: shellcheck testdivoip.sh install.sh verify.sh functions/*.sh
